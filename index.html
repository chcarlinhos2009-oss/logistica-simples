/* =========================================================

var SESSION_KEY = 'ls_secure_session';
var SESSION_TIMEOUT = 30 * 60 * 1000; // 30 minutos
var SESSION_WARNING = 5 * 60 * 1000;  // aviso nos últimos 5 minutos
var sessionTimer = null;
var sessionWarningShown = false;

function salvarUsuariosLocalSeguro(){
  try{

  }catch(e){ console.warn('Não foi possível atualizar o cache seguro de usuários.', e); }
}

function salvarSessaoSegura(usuario){
  if(!usuario) return;
  var sessao = {
    id: usuario.id,
    usuario: usuario.usuario,
    perfil: usuario.perfil,
    email: usuario.email || '',
    escola: usuario.escola || escolaAtual,
    ultimoAcesso: Date.now()
  };
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessao));
  sessionStorage.setItem('ls_user', JSON.stringify(sessao));
  iniciarMonitorSessao();
}

function lerSessaoSegura(){
  try{
    var raw = sessionStorage.getItem(SESSION_KEY) || sessionStorage.getItem('ls_user');
    if(!raw) return null;
    var s = JSON.parse(raw);
    if(!s || !s.ultimoAcesso || (Date.now() - Number(s.ultimoAcesso)) > SESSION_TIMEOUT){
      sessionStorage.removeItem(SESSION_KEY);
      sessionStorage.removeItem('ls_user');
      return null;
    }
    return s;
  }catch(e){
    sessionStorage.removeItem(SESSION_KEY);
    sessionStorage.removeItem('ls_user');
    return null;
  }
}

function tocarSessao(){
  var s = lerSessaoSegura();
  if(!s) return false;
  s.ultimoAcesso = Date.now();
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(s));
  sessionStorage.setItem('ls_user', JSON.stringify(s));
  sessionWarningShown = false;
  return true;
}

function encerrarSessaoPorInatividade(){
  if(sessionTimer) clearInterval(sessionTimer);
  sessionTimer = null;
  sessionStorage.removeItem(SESSION_KEY);
  sessionStorage.removeItem('ls_user');
  usuarioAtual = null;
  perfil = 'Coordenador';
  notify('Sua sessão expirou por segurança. Faça login novamente.', 'warning');
  telaInicial();
}

function iniciarMonitorSessao(){
  if(sessionTimer) clearInterval(sessionTimer);
  sessionWarningShown = false;
  sessionTimer = setInterval(function(){
    var s = lerSessaoSegura();
    if(!s){ clearInterval(sessionTimer); sessionTimer=null; return; }
    var restante = SESSION_TIMEOUT - (Date.now() - Number(s.ultimoAcesso));
    if(restante <= 0){ encerrarSessaoPorInatividade(); return; }
    if(restante <= SESSION_WARNING && !sessionWarningShown){
      sessionWarningShown = true;
      notify('Sua sessão será encerrada em alguns minutos se não houver atividade.', 'warning');
    }
  }, 15000);
}

async function gerarHashSenha(senha, saltB64){
  var salt;
  if(saltB64){
    var bin = atob(saltB64), arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    salt = arr;
  }else{
    salt = crypto.getRandomValues(new Uint8Array(16));
  }
  var enc = new TextEncoder();
  var keyMaterial = await crypto.subtle.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:salt, iterations:120000, hash:'SHA-256'}, keyMaterial, 256);
  var bytes = new Uint8Array(bits), bin2='';
  for(var j=0;j<bytes.length;j++) bin2 += String.fromCharCode(bytes[j]);
  var saltBin='';
  for(var k=0;k<salt.length;k++) saltBin += String.fromCharCode(salt[k]);
  return {hash:btoa(bin2), salt:btoa(saltBin)};
}

async function senhaValida(usuario, senha){
  if(usuario && usuario.senhaHash && usuario.senhaSalt){
    var h = await gerarHashSenha(senha, usuario.senhaSalt);
    return h.hash === usuario.senhaHash;
  }
  // Compatibilidade/migração: contas antigas ainda podem possuir senha em texto puro.
  return usuario && usuario.senha !== undefined && usuario.senha !== null && String(usuario.senha) === String(senha);
}

async function migrarSenhaSeNecessario(usuario, senha){
  if(!usuario || usuario.senhaHash) return false;
  var h = await gerarHashSenha(senha);
  usuario.senhaHash = h.hash;
  usuario.senhaSalt = h.salt;
  delete usuario.senha;
  return true;
}

function sbHeaders(extra){
  var h = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  };
  if(extra) Object.keys(extra).forEach(function(k){ h[k] = extra[k]; });
  return h;
}

function sbUrl(table, query){
  return SUPABASE_REST + '/' + table + (query ? '?' + query : '');
}

async function sbRequest(table, method, query, body, extraHeaders){
  var resp = await fetch(sbUrl(table, query), {
    method: method || 'GET',
    headers: sbHeaders(extraHeaders),
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  var text = await resp.text();
  var data = null;
  if(text){ try { data = JSON.parse(text); } catch(e) { data = text; } }
  if(!resp.ok){
    var detalhe = data && data.message ? data.message : (data && data.error ? data.error : text);
    throw new Error('Supabase ' + resp.status + ': ' + (detalhe || 'erro na API'));
  }
  return data;
}

    return false;

function esc(x){
    var v = (x !== null && x !== undefined) ? String(x) : '';
    return v.replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];
    });
}

// SISTEMA DE NOTIFICAÇÕES (TOAST)
function notify(texto, tipo) {
  tipo = tipo || 'success';
  var container = document.getElementById('toast-container');
  if (!container) return;

  var toast = document.createElement('div');
  toast.className = 'toast-enter pointer-events-auto flex items-center gap-3 p-4 rounded-2xl shadow-lg border text-xs font-semibold ' +
    (tipo === 'error' ? 'bg-red-600 text-white border-red-700' :
     tipo === 'warning' ? 'bg-amber-500 text-white border-amber-600' :
     'bg-gray-900 text-white dark:bg-white dark:text-gray-900 border-gray-800');

  var icone = tipo === 'error' ? 'fa-circle-xmark' :
              tipo === 'warning' ? 'fa-triangle-exclamation' :
              'fa-circle-check';

  toast.innerHTML = '<i class="fas ' + icone + ' text-base"></i><span class="flex-1">' + esc(texto) + '</span>';
  container.appendChild(toast);

  setTimeout(function() {
    toast.classList.remove('toast-enter');
    toast.classList.add('toast-exit');
    setTimeout(function() { toast.remove(); }, 300);
  }, 3000);
}

function msg(t, tipo){
  notify(t, tipo || 'warning');
}

// MODAL DE CONFIRMAÇÃO PERSONALIZADO
function pedirConfirmacao(mensagem, aoConfirmar) {
  var modal = document.getElementById('confirm-modal');
  var msgEl = document.getElementById('confirm-msg');
  var btnOk = document.getElementById('confirm-btn-ok');
  var btnCancel = document.getElementById('confirm-btn-cancel');

  msgEl.textContent = mensagem;
  modal.classList.remove('hidden');

  function fechar() {
    modal.classList.add('hidden');
    btnOk.onclick = null;
    btnCancel.onclick = null;
  }

  btnCancel.onclick = fechar;
  btnOk.onclick = function() {
    fechar();
    aoConfirmar();
  };
}

// FUNÇÃO PARA ALTERNAR A VISIBILIDADE DOS CAMPOS DE SENHA E TOKEN
function alternarVisibilidadeCampo(idInput, idIcone) {
  var campo = document.getElementById(idInput);
  var icone = document.getElementById(idIcone);
  if (!campo || !icone) return;

  if (campo.type === 'password') {
    campo.type = 'text';
    icone.classList.remove('fa-eye');
    icone.classList.add('fa-eye-slash');
  } else {
    campo.type = 'password';
    icone.classList.remove('fa-eye-slash');
    icone.classList.add('fa-eye');
  }
}

async function solicitarTokenEmail(){
  var emailEl = document.getElementById('cemail');
  var escolaEl = document.getElementById('cescola');
  var email = emailEl ? emailEl.value.trim() : '';
  var escolaSolicitante = escolaEl ? escolaEl.value.trim() : '';

  if(!email || !email.includes('@')){
    msg('Por favor, digite um e-mail válido para solicitar o token.', 'error');
    return;
  }
  if(!escolaSolicitante){
    msg('Informe a escola antes de solicitar o token.', 'error');
    return;
  }

  try{
    var pendentes = await sbRequest('solicitacoes', 'GET',
      'select=id&email=eq.' + encodeURIComponent(email) +
      '&escola=eq.' + encodeURIComponent(escolaSolicitante) +
      '&status=eq.pendente&limit=1');

    if(pendentes && pendentes.length){
      msg('Já existe uma solicitação pendente para este e-mail.', 'warning');
      return;
    }

    await sbRequest('solicitacoes', 'POST', '', {
      escola: escolaSolicitante,
      email: email,
      data: new Date().toLocaleString('pt-BR'),
      status: 'pendente'
    }, {'Prefer':'return=minimal'});

    notify('Solicitação enviada! Aguarde a aprovação.', 'success');
  }catch(err){
    console.error(err);
    msg('Não foi possível enviar a solicitação online. Verifique as permissões da tabela solicitacoes no Supabase.', 'error');
  }
}

       status: 'usado'

   }catch(err){
     console.error(err);
     msg('Token inválido. Verifique o código informado e tente novamente.', 'error');

 }

 });
 if(usuarioExiste){msg('Esse usuário já existe. Escolha outro.', 'error');return false;}

 usuarios.push(novo);
 usarEscola(escolaNova);
 salvarUsuariosLocalSeguro();

async function login(tipo){
 var escolaEl = document.getElementById('lescola'), userEl = document.getElementById('luser'), senhaEl = document.getElementById('lsenha'), lembrarEl = document.getElementById('lembrar');

 var lembrar = !!(lembrarEl && lembrarEl.checked);

 if(!e || !u || !s){msg('Preencha escola, usuário e senha.', 'error');return false;}

 var carregou = await carregarDadosOnline(e, true);
 if(!carregou){
   msg('Não foi possível consultar o banco online. Tente novamente.', 'error');
   return false;
 }

 var x = usuarios.find(function(a){
    var uName = (a && a.usuario) ? String(a.usuario).trim().toLowerCase() : '';
    return uName === u.toLowerCase();
 });

 if(!x){msg('Usuário ou senha incorretos.', 'error');return false;}
 if(tipo && x.perfil !== tipo){msg('Esse usuário não pertence ao perfil escolhido.', 'error');return false;}
 if(x.escola && String(x.escola).toLowerCase() !== e.toLowerCase()){msg('Esse usuário não está cadastrado nesta escola.', 'error');return false;}

 var senhaOk = await senhaValida(x, s);
 if(!senhaOk){msg('Usuário ou senha incorretos.', 'error');return false;}

 var migrou = await migrarSenhaSeNecessario(x, s);
 if(migrou){
   var migrouOnline = await salvarDadosOnline();
   if(!migrouOnline){
     msg('Login realizado, mas não foi possível concluir a migração segura da senha no servidor.', 'warning');
   }
 }

 escola = e;
 usarEscola(e);
 perfil = x.perfil;
 usuarioAtual = Object.assign({}, x);
 delete usuarioAtual.senha;
 var fabSuporte = document.getElementById('support-fab');
 if(fabSuporte) fabSuporte.classList.remove('hidden');
 alertasLidos = false;
 salvarSessaoSegura(usuarioAtual);
 salvarUsuariosLocalSeguro();
 if(lembrar) localStorage.setItem('ls_escola', e); else localStorage.removeItem('ls_escola');
 notify('Login realizado com sucesso!', 'success');
 dashboard();
 return false;
}

function filtrarUsuarios(valor){
  window.__usuariosBusca = valor || '';

}

async function addUsuario(){
  if(perfil !== 'Coordenador') return msg('Acesso permitido somente ao Coordenador.', 'error');
  var unome = document.getElementById('unome');
  var uuser = document.getElementById('uuser');
  var usenha = document.getElementById('usenha');
  var uperfil = document.getElementById('uperfil');
  var btn = document.getElementById('btn-add-usuario');
  var nome = unome ? unome.value.trim() : '';
  var loginUser = uuser ? uuser.value.trim() : '';
  var senha = usenha ? usenha.value : '';
  var perfilNovo = uperfil ? uperfil.value : 'Professor';

  if(!nome || !loginUser || !senha) return msg('Preencha todos os campos.', 'error');
  if(loginUser.length < 3) return msg('O usuário deve ter pelo menos 3 caracteres.', 'error');
  if(senha.length < 4) return msg('A senha deve ter pelo menos 4 caracteres.', 'error');

  var existe = usuarios.some(function(u){ return String(u.usuario || '').trim().toLowerCase() === loginUser.toLowerCase(); });
  if(existe) return msg('Usuário já existe. Escolha outro.', 'error');

  var novo = {id:Date.now(), nome:nome, usuario:loginUser, senha:senha, perfil:perfilNovo, escola:escolaBanco || escola};
  usuarios.push(novo);

  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Salvando...'; }
  var salvou = await salvarDadosOnline();
  salvarUsuariosLocalSeguro();

  if(!salvou && onlineReady){
    usuarios = usuarios.filter(function(u){ return u.id !== novo.id; });
    salvarUsuariosLocalSeguro();
    msg('Não foi possível salvar o usuário no servidor. Tente novamente.', 'error');
    usuariosTela();
    return;
  }

  notify(salvou ? 'Usuário cadastrado e sincronizado com sucesso!' : 'Usuário cadastrado neste dispositivo.', salvou ? 'success' : 'warning');
  window.__usuariosBusca = '';
  usuariosTela();
}

function removeUsuario(id){
  if(perfil !== 'Coordenador') return msg('Acesso permitido somente ao Coordenador.', 'error');
  var alvo = usuarios.find(function(u){ return Number(u.id) === Number(id); });
  if(!alvo) return;
  if(String(alvo.usuario || '').toLowerCase() === 'admin') return msg('O usuário principal não pode ser excluído.', 'warning');

  pedirConfirmacao('Deseja realmente remover o usuário "' + (alvo.nome || alvo.usuario) + '"?', async function(){
    var copia = usuarios.slice();
    usuarios = usuarios.filter(function(u){ return Number(u.id) !== Number(id); });
    var salvou = await salvarDadosOnline();
    salvarUsuariosLocalSeguro();

    if(!salvou && onlineReady){
      usuarios = copia;
      salvarUsuariosLocalSeguro();
      msg('Não foi possível excluir o usuário no servidor. Tente novamente.', 'error');
      usuariosTela();
      return;
    }

    notify(salvou ? 'Usuário excluído e sincronizado com sucesso!' : 'Usuário excluído neste dispositivo.', salvou ? 'success' : 'warning');
    usuariosTela();
  });
}

function confirmarSaida(id){
  if(perfil !== 'Coordenador') return;
  var qInput = document.getElementById('qntSaida');
  var q = Number(qInput ? qInput.value : 0);
  var p = db.materiais.find(function(x){ return x.id === id; });
  if(!q || q <= 0){
    msg('Por favor, informe uma quantidade válida.', 'error');

  }
  if(p){

      notify('Saída registrada com sucesso!', 'success');
    }

    materiais();
  }

function addEmp(){
  var le = document.getElementById('le'), lq = document.getElementById('lq'), lp = document.getElementById('lp'), ld = document.getElementById('ld');
  var valor = le ? le.value : '';
  var q = Number(lq ? lq.value : 0);
  var pessoa = lp ? lp.value.trim() : '';
  var destino = ld ? ld.value.trim() : '';

  if(!valor) return msg('Selecione um material ou equipamento.', 'error');
  if(!q || q <= 0) return msg('Informe uma quantidade válida.', 'error');
  if(!pessoa || !destino) return msg('Preencha quem retirou e a sala/setor.', 'error');

  var partes = valor.split(':');
  var tipo = partes[0];
  var id = Number(partes[1]);
  var p = null, e = null;

  if(tipo === 'm'){
    p = db.materiais.find(function(x){ return Number(x.id) === id; });
    if(!p) return msg('Material não encontrado.', 'error');
    if(q > Number(p.qtd || 0))
      return msg('Quantidade indisponível! Disponíveis: ' + Number(p.qtd || 0), 'error');
  } else if(tipo === 'e'){
    e = db.equip.find(function(x){ return Number(x.id) === id; });
    if(!e) return msg('Equipamento não encontrado.', 'error');
    if(q > Number(e.disp || 0))
      return msg('Quantidade indisponível! Disponíveis: ' + Number(e.disp || 0), 'error');
  } else {
    return msg('Item inválido.', 'error');
  }

  var data = new Date().toLocaleString('pt-BR');

  if(p){
    p.qtd -= q;
  } else if(e){
    e.disp -= q;
    e.emp = Number(e.emp || 0) + q;
  }

  db.emp.unshift({
    id: Date.now(),
    materialId: p ? p.id : null,
    equipId: e ? e.id : null,
    qtd: q,
    pessoa: pessoa,
    destino: destino,
    data: data,
    ativo: true,
    tipo: e ? 'Equipamento' : 'Material',
    cor: e ? (e.cor || '') : '',
    modelo: e ? (e.modelo || '') : ''
  });

  var nomeItem = e ? e.nome : p.nome;
  var detalhe = e
    ? pessoa + ' · ' + destino + ' · Modelo: ' + e.modelo + ' · Cor: ' + e.cor
    : pessoa + ' · ' + destino;

  hist('Empréstimo', nomeItem, q + ' un.', detalhe);
  save();

  if(p && p.qtd <= p.min){
    alertasLidos = false;
    notify('Retirada registrada! Item atingiu o estoque mínimo.', 'warning');
  } else {
    notify('Empréstimo registrado com sucesso!', 'success');
  }

  emprestimos();
}

function devolver(id){
  var l = db.emp.find(function(x){ return x.id === id; });
  if(!l) return;

  var p = db.materiais.find(function(x){ return Number(x.id) === Number(l.materialId); });
  var e = db.equip.find(function(x){ return Number(x.id) === Number(l.equipId); });
  var qtd = Number(l.qtd || 0);

  if(e){
    e.disp = Number(e.disp || 0) + qtd;
    e.emp = Math.max(0, Number(e.emp || 0) - qtd);
  } else if(p){
    p.qtd += qtd;
  }

  l.ativo = false;
  l.dataDevolucao = new Date().toLocaleString('pt-BR');

  var nomeItem = e ? e.nome : (p ? p.nome : 'Item');
  var detalhe = e
    ? l.pessoa + ' · ' + l.destino + ' · Modelo: ' + (e.modelo || l.modelo || '-') + ' · Cor: ' + (e.cor || l.cor || '-')
    : l.pessoa + ' · ' + l.destino;

  hist('Devolução', nomeItem, qtd + ' un.', detalhe);
  save();
  notify('Devolução realizada com sucesso!', 'success');
  emprestimos();
}

var historicoFiltro = { busca:'', tipo:'', periodo:'todos' };

function hist(tipo,item,qtd,det){
  db.hist.unshift({
    id: Date.now() + Math.floor(Math.random()*1000),
    data: new Date().toLocaleString('pt-BR'),
    ts: new Date().toISOString(),
    tipo: tipo, item: item, qtd: qtd, det: det
  });
}

function historicoCorTipo(tipo){
  var t = String(tipo || '').toLowerCase();
  if(t === 'entrada') return 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-300';
  if(t === 'saída' || t === 'saida') return 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-300';
  if(t === 'empréstimo' || t === 'emprestimo') return 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300';
  if(t === 'devolução' || t === 'devolucao') return 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300';
  if(t === 'cadastro') return 'bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-300';
  if(t === 'exclusão' || t === 'exclusao') return 'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200';
  return 'bg-blue-50 text-brandLightBlue dark:bg-blue-900/30 dark:text-blue-300';
}

function historicoDataFallback(valor){
  if(!valor) return 0;
  var m = String(valor).match(/(\d{1,2})\/(\d{1,2})\/(\d{4}).*?(\d{1,2}):(\d{2})/);
  if(!m) return 0;
  return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]),Number(m[4]),Number(m[5])).getTime();
}

function historicoDadosFiltrados(){
  var busca = String(historicoFiltro.busca || '').trim().toLowerCase();
  var tipo = String(historicoFiltro.tipo || '').toLowerCase();
  var periodo = historicoFiltro.periodo || 'todos';
  var agora = Date.now(), limite = 0;
  if(periodo === 'hoje') limite = new Date().setHours(0,0,0,0);
  if(periodo === '7dias') limite = agora - 7*24*60*60*1000;
  if(periodo === '30dias') limite = agora - 30*24*60*60*1000;
  return (Array.isArray(db.hist) ? db.hist : []).filter(function(h){
    var texto = [h.tipo,h.item,h.qtd,h.det,h.data].join(' ').toLowerCase();
    if(busca && texto.indexOf(busca) === -1) return false;
    if(tipo && String(h.tipo || '').toLowerCase() !== tipo) return false;
    if(limite){
      var d = h.ts ? new Date(h.ts).getTime() : historicoDataFallback(h.data);
      if(!d || d < limite) return false;
    }
    return true;
  });
}

function exportarRelatorioCSV(tipo){
  var linhas=[], nome='relatorio';
  if(tipo==='estoque'){
    nome='estoque'; linhas.push(['Material','Categoria','Quantidade','Unidade','Estoque mínimo','Status']);
    (db.materiais||[]).forEach(function(p){ linhas.push([p.nome,p.cat,p.qtd,p.un,p.min,Number(p.qtd)<=Number(p.min)?'Estoque baixo':'Normal']); });
  } else if(tipo==='equipamentos'){
    nome='equipamentos'; linhas.push(['Equipamento','Modelo','Cor','Total','Disponível','Emprestado']);
    (db.equip||[]).forEach(function(e){ linhas.push([e.nome,e.modelo,e.cor||e.pat,e.total,e.disp,e.emp]); });
  } else if(tipo==='historico'){
    nome='movimentacoes'; linhas.push(['Data','Ação','Item','Quantidade','Detalhes']);
    (db.hist||[]).forEach(function(h){ linhas.push([h.data,h.tipo,h.item,h.qtd,h.det]); });
  } else {
    nome='emprestimos-ativos'; linhas.push(['Item','Quantidade','Responsável','Destino','Data']);
    (db.emp||[]).filter(function(x){return x.ativo;}).forEach(function(l){
      var p=db.materiais.find(function(x){return Number(x.id)===Number(l.materialId)}), e=db.equip.find(function(x){return Number(x.id)===Number(l.equipId)});
      linhas.push([(p&&p.nome)||(e&&e.nome)||'Item',l.qtd||1,l.pessoa,l.destino,l.data]);
    });
  }
  function csvVal(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
  var csv='\ufeff'+linhas.map(function(r){return r.map(csvVal).join(';')}).join('\r\n');
  var url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  var a=document.createElement('a'); a.href=url; a.download='logistica-simples-'+nome+'-'+new Date().toISOString().slice(0,10)+'.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  notify('Arquivo CSV exportado com sucesso.','success');
}

   V8 — BACKUP E RECUPERAÇÃO
   - Exportação completa dos dados da escola em JSON.
   - Senhas em texto nunca entram no backup; apenas hashes/salts.
   - Restauração exclusiva do Coordenador, com confirmação.
   ========================================================= */
function criarBackupJSON(){
  if(perfil !== 'Coordenador'){
    notify('Apenas o Coordenador pode gerar backups.', 'error');
    return;
  }
  var usuariosBackup = (Array.isArray(usuarios) ? usuarios : []).map(function(u){
    var c = Object.assign({}, u);
    delete c.senha;
    return c;
  });
  var pacote = {
    app: 'Logística Simples',
    versao: 'V8',
    tipo: 'backup',
    escola: escolaAtual || escola || '',
    geradoEm: new Date().toISOString(),
    dados: {
      usuarios: usuariosBackup,
      db: db || dadosIniciais()
    }
  };
  var json = JSON.stringify(pacote, null, 2);
  var blob = new Blob([json], {type:'application/json;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var nomeEscola = String(pacote.escola || 'escola').replace(/[^a-z0-9_-]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();
  a.href = url;
  a.download = 'backup-logistica-simples-' + (nomeEscola || 'escola') + '-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  notify('Backup gerado com sucesso.', 'success');
}

function selecionarBackupArquivo(input){
  var arquivo = input && input.files ? input.files[0] : null;
  if(!arquivo) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var pacote = JSON.parse(reader.result);
      if(!pacote || pacote.tipo !== 'backup' || pacote.app !== 'Logística Simples' || !pacote.dados){
        throw new Error('Arquivo de backup inválido.');
      }
      if(!pacote.dados.db || !Array.isArray(pacote.dados.db.materiais) || !Array.isArray(pacote.dados.db.equip)){
        throw new Error('Estrutura de dados inválida.');
      }
      var escolaBackup = String(pacote.escola || '').trim();
      if(escolaBackup && escolaAtual && escolaBackup.toLowerCase() !== escolaAtual.toLowerCase()){
        if(!confirm('Este backup pertence à escola "' + escolaBackup + '" e você está logado como "' + escolaAtual + '". Deseja continuar mesmo assim?')){
          input.value='';
          return;
        }
      }
      var ok = confirm('Atenção: restaurar este backup substituirá os dados atuais desta escola. Esta ação não pode ser desfeita automaticamente. Deseja continuar?');
      if(!ok){ input.value=''; return; }

      usuarios = normalizarUsuarios(Array.isArray(pacote.dados.usuarios) ? pacote.dados.usuarios : []);
      normalizarDb(pacote.dados.db);
      usarEscola(escolaAtual || escolaBackup);
      salvarUsuariosLocalSeguro();
      localStorage.setItem(K, JSON.stringify(db));

      salvarDadosOnline().then(function(salvou){
        if(!salvou){
          notify('Backup restaurado neste dispositivo, mas não foi possível sincronizar com o servidor.', 'warning');
          return;
        }
        notify('Backup restaurado e sincronizado com sucesso.', 'success');
        dashboard();
      }).catch(function(err){
        console.error(err);
        notify('Backup restaurado localmente, mas ocorreu um erro na sincronização.', 'warning');
      });
    }catch(err){
      console.error(err);
      notify('Não foi possível restaurar o backup: arquivo inválido.', 'error');
    }finally{
      input.value='';
    }
  };
  reader.readAsText(arquivo);
}

var SUPORTE_FUNCTION_URL = SUPABASE_URL + '/functions/v1/suporte';

function suporteIdentidade(){

async function suporteRequest(body){
  var resp = await fetch(SUPORTE_FUNCTION_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY
    },
    body: JSON.stringify(body)
  });
  var texto = await resp.text();
  var data = null;
  try { data = texto ? JSON.parse(texto) : {}; } catch(e) { data = {erro:texto}; }
  if(!resp.ok || data.sucesso === false){
    throw new Error(data && (data.erro || data.message) ? (data.erro || data.message) : 'Não foi possível comunicar com o suporte.');
  }
  return data;
}

  var usuarioV = String((usuarioEl && usuarioEl.value) || id.usuario || '').trim();
  var emailV = String((emailEl && emailEl.value) || id.email || '').trim();
  var perfilV = String((perfilEl && perfilEl.value) || id.perfil || 'Professor').trim();
  var assuntoV = String((assuntoEl && assuntoEl.value) || '').trim();
  var mensagemV = String((mensagemEl && mensagemEl.value) || '').trim();

  if(!escolaV || !usuarioV || !perfilV || !assuntoV || !mensagemV){
    msg('Preencha os dados do atendimento.', 'error');
    return;
  }
  if(categoria === 'recuperacao' && !emailV){
    msg('Informe um e-mail para facilitar a recuperação do acesso.', 'error');
    return;
  }

  try{
    var btns = document.querySelectorAll('#support-body button');
    btns.forEach(function(b){ b.disabled = true; });
    var data = await suporteRequest({
      acao:'criar_atendimento', escola:escolaV, usuario:usuarioV, email:emailV,
      perfil:perfilV, categoria:categoria, assunto:assuntoV, mensagem:mensagemV
    });
    if(!data.atendimento) throw new Error('Atendimento não retornado.');
    suporteAtendimentoAtual = data.atendimento;
    renderSuporteConversa(data.atendimento, [{
      remetente:usuarioV, remetente_tipo:'usuario', mensagem:mensagemV, created_at:new Date().toISOString()
    }]);
    notify('Atendimento #'+data.atendimento.id+' enviado com sucesso.', 'success');
  }catch(e){
    console.error('Erro ao criar atendimento:', e);
    msg(e.message || 'Não foi possível enviar o atendimento.', 'error');
    var btns2 = document.querySelectorAll('#support-body button');
    btns2.forEach(function(b){ b.disabled = false; });
  }
}

async function listarMeusAtendimentos(){
  var id = suporteIdentidade();
  var body = document.getElementById('support-body');
  if(!body) return;
  if(!id.escola || !id.usuario){
    body.innerHTML = '<div class="text-center py-8"><div class="text-gray-400 text-sm mb-2"><i class="fas fa-user-lock text-2xl"></i></div><p class="text-xs text-gray-500">Faça login para visualizar seus atendimentos.</p><button onclick="renderSuporteInicio()" class="mt-4 text-xs font-bold text-brandDarkBlue">Voltar</button></div>';
    return;
  }
  body.innerHTML = '<div class="text-center py-8 text-xs text-gray-400"><i class="fas fa-spinner fa-spin mr-2"></i>Carregando atendimentos...</div>';
  try{
    var data = await suporteRequest({acao:'listar_atendimentos', escola:id.escola, usuario:id.usuario});
    var lista = data.atendimentos || [];
    if(!lista.length){
      body.innerHTML = '<button onclick="renderSuporteInicio()" class="text-[11px] font-bold text-gray-400 mb-4"><i class="fas fa-arrow-left mr-1"></i>Voltar</button><div class="text-center py-8"><i class="fas fa-inbox text-3xl text-gray-300"></i><p class="text-xs text-gray-400 mt-2">Você ainda não possui atendimentos.</p></div>';
      return;
    }
    var statusClass = function(st){ return st==='resolvido' ? 'bg-green-50 text-green-700' : st==='encerrado' ? 'bg-gray-100 text-gray-600' : st==='em_atendimento' ? 'bg-amber-50 text-amber-700' : 'bg-red-50 text-red-600'; };
    body.innerHTML = '<button onclick="renderSuporteInicio()" class="text-[11px] font-bold text-gray-400 mb-4"><i class="fas fa-arrow-left mr-1"></i>Voltar</button>' +
      '<div class="space-y-2">' + lista.map(function(a){
        return '<button onclick="abrirAtendimento('+Number(a.id)+')" class="w-full text-left p-3 rounded-2xl border dark:border-gray-700 hover:border-brandLightBlue transition"><div class="flex items-start gap-2"><span class="flex-1 min-w-0"><strong class="block text-xs truncate">#'+Number(a.id)+' · '+esc(a.assunto)+'</strong><span class="block text-[10px] text-gray-400 mt-1">'+esc(a.categoria)+' · '+esc(a.created_at ? new Date(a.created_at).toLocaleString('pt-BR') : '')+'</span></span><span class="shrink-0 px-2 py-1 rounded-full text-[9px] font-extrabold '+statusClass(a.status)+'">'+esc(a.status.replace('_',' '))+'</span></div></button>';
      }).join('') + '</div>';
  }catch(e){
    console.error('Erro ao listar atendimentos:', e);
    body.innerHTML = '<button onclick="renderSuporteInicio()" class="text-[11px] font-bold text-gray-400 mb-4"><i class="fas fa-arrow-left mr-1"></i>Voltar</button><div class="text-center py-8 text-xs text-red-500">Não foi possível carregar seus atendimentos.</div>';
  }
}

async function abrirAtendimento(id){
  var ident = suporteIdentidade();
  var body = document.getElementById('support-body');
  if(!body) return;
  body.innerHTML = '<div class="text-center py-8 text-xs text-gray-400"><i class="fas fa-spinner fa-spin mr-2"></i>Carregando conversa...</div>';
  try{
    var lista = await suporteRequest({acao:'listar_atendimentos', escola:ident.escola, usuario:ident.usuario});
    var atendimento = (lista.atendimentos || []).find(function(a){ return Number(a.id)===Number(id); });
    if(!atendimento) throw new Error('Atendimento não encontrado.');
    var data = await suporteRequest({acao:'listar_mensagens', atendimento_id:Number(id), escola:ident.escola, usuario:ident.usuario});
    suporteAtendimentoAtual = atendimento;
    renderSuporteConversa(atendimento, data.mensagens || []);
  }catch(e){
    console.error('Erro ao abrir atendimento:', e);
    msg(e.message || 'Não foi possível abrir o atendimento.', 'error');
    listarMeusAtendimentos();
  }
}

function renderSuporteConversa(atendimento, mensagens){
  var body = document.getElementById('support-body');
  if(!body) return;
  var ident = suporteIdentidade();
  var fechado = atendimento.status === 'encerrado';
  var statusLabel = atendimento.status ? atendimento.status.replace('_',' ') : 'aberto';
  var statusCor = atendimento.status==='resolvido' ? 'text-green-600 bg-green-50' : atendimento.status==='encerrado' ? 'text-gray-600 bg-gray-100' : atendimento.status==='em_atendimento' ? 'text-amber-700 bg-amber-50' : 'text-red-600 bg-red-50';
  var msgsHtml = (mensagens || []).map(function(m){
    var souEu = m.remetente_tipo === 'usuario';
    return '<div class="flex '+(souEu?'justify-end':'justify-start')+' mb-2"><div class="max-w-[86%] px-3 py-2.5 rounded-2xl '+(souEu?'bg-brandDarkBlue text-white rounded-br-md':'bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded-bl-md')+'"><div class="text-[9px] opacity-70 mb-1">'+esc(souEu?'Você':'Suporte')+'</div><div class="text-xs whitespace-pre-wrap break-words">'+esc(m.mensagem)+'</div><div class="text-[8px] opacity-60 mt-1 text-right">'+esc(m.created_at ? new Date(m.created_at).toLocaleString('pt-BR') : '')+'</div></div></div>';
  }).join('');

  body.innerHTML =
    '<button type="button" onclick="listarMeusAtendimentos()" class="text-[11px] font-bold text-gray-400 mb-3"><i class="fas fa-arrow-left mr-1"></i>Meus atendimentos</button>' +
    '<div class="mb-3"><div class="flex items-center gap-2"><h3 class="font-extrabold text-sm flex-1">#'+Number(atendimento.id)+' · '+esc(atendimento.assunto)+'</h3><span class="px-2 py-1 rounded-full text-[9px] font-extrabold '+statusCor+'">'+esc(statusLabel)+'</span></div><p class="text-[10px] text-gray-400 mt-1">'+esc(atendimento.categoria)+' · '+esc(atendimento.escola)+'</p></div>' +
    '<div id="support-messages" class="h-72 overflow-y-auto rounded-2xl border dark:border-gray-700 p-3 bg-gray-50/70 dark:bg-gray-900/30">'+(msgsHtml || '<div class="text-center text-xs text-gray-400 py-10">Nenhuma mensagem ainda.</div>')+'</div>' +
    (fechado ? '<div class="mt-3 p-3 rounded-xl bg-gray-100 dark:bg-gray-700 text-center text-[10px] text-gray-500">Este atendimento foi encerrado.</div>' :
      '<div class="mt-3 flex gap-2"><textarea id="support-reply" rows="2" maxlength="5000" class="input flex-1 resize-none" placeholder="Digite uma mensagem..."></textarea><button type="button" onclick="enviarMensagemAtendimento()" class="w-12 shrink-0 rounded-xl bg-brandDarkBlue text-white hover:opacity-90"><i class="fas fa-paper-plane"></i></button></div>') +
    '<button type="button" onclick="atualizarConversaAtual()" class="w-full mt-2 py-2 text-[10px] font-bold text-gray-400 hover:text-brandDarkBlue"><i class="fas fa-rotate mr-1"></i>Atualizar conversa</button>';
  var box = document.getElementById('support-messages');
  if(box) box.scrollTop = box.scrollHeight;
}

async function atualizarConversaAtual(){
  if(!suporteAtendimentoAtual) return;
  await abrirAtendimento(suporteAtendimentoAtual.id);
}

async function enviarMensagemAtendimento(){
  if(!suporteAtendimentoAtual) return;
  var el = document.getElementById('support-reply');
  var mensagem = String((el && el.value) || '').trim();
  if(!mensagem){ msg('Digite uma mensagem.', 'warning'); return; }
  var id = suporteIdentidade();
  try{
    await suporteRequest({acao:'enviar_mensagem', atendimento_id:Number(suporteAtendimentoAtual.id), escola:id.escola, usuario:id.usuario, mensagem:mensagem});
    await abrirAtendimento(suporteAtendimentoAtual.id);
  }catch(e){
    console.error('Erro ao enviar mensagem:', e);
    msg(e.message || 'Não foi possível enviar a mensagem.', 'error');
  }
}

function iniciarMonitorSuporte(){
  if(suportePollTimer) clearInterval(suportePollTimer);
  suportePollTimer = setInterval(async function(){
    var id = suporteIdentidade();
    if(!id.escola || !id.usuario) return;
    try{
      var data = await suporteRequest({acao:'listar_atendimentos', escola:id.escola, usuario:id.usuario});
      var total = (data.atendimentos || []).filter(function(a){ return a.status === 'em_atendimento'; }).length;
      var badge = document.getElementById('support-badge');
      if(badge){
        if(total > 0){ badge.textContent=String(total); badge.classList.remove('hidden'); badge.classList.add('flex'); }
        else { badge.classList.add('hidden'); badge.classList.remove('flex'); }
      }
    }catch(e){ /* suporte indisponível não deve quebrar o sistema principal */ }
  }, 30000);
}

iniciarMonitorSuporte();

// Inicialização: valida a sessão protegida antes de abrir o painel.
inicializarApp();

</script>
</body>
</html>
