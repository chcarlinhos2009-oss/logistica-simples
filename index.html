/* =========================================================
   SUPABASE — armazenamento online do Logística Simples
   A chave publishable/anon é apropriada para uso no navegador.
   O banco deve permanecer protegido por RLS.
   ========================================================= */
var SUPABASE_URL = 'https://okrgeuuqbadsexsumjbz.supabase.co';
var SUPABASE_KEY = 'sb_publishable_2pow_sr87FSuqs7kZMYnBg_RbE5Sk7C';
var SUPABASE_REST = SUPABASE_URL + '/rest/v1';
var K = 'ls_pro';
var AUTH_KEY = 'ls_auth';
var onlineReady = false;
var onlineSaving = false;

// CHAVE DE SEGURANÇA PARA CADASTRAR COORDENADOR
var COORDINATOR_KEY = null; // tokens válidos são gerados pelo Painel Dev

function sbHeaders(extra){
  var h = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  };
  if(extra) Object.keys(extra).forEach(function(k){ h[k] = extra[k]; });
  return h;
}

function sbUrl(table, query){
  return SUPABASE_REST + '/' + table + (query ? '?' + query : '');
}

async function sbRequest(table, method, query, body, extraHeaders){
  var resp = await fetch(sbUrl(table, query), {
    method: method || 'GET',
    headers: sbHeaders(extraHeaders),
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  var text = await resp.text();
  var data = null;
  if(text){ try { data = JSON.parse(text); } catch(e) { data = text; } }
  if(!resp.ok){
    var detalhe = data && data.message ? data.message : (data && data.error ? data.error : text);
    throw new Error('Supabase ' + resp.status + ': ' + (detalhe || 'erro na API'));
  }
  return data;
}

function dadosIniciais(){
  return {

function normalizarUsuarios(lista){
  lista = Array.isArray(lista) ? lista : [];
  lista = lista.map(function(u){
    var p = u.perfil === 'Gestor' ? 'Coordenador' : (u.perfil === 'Funcionário' ? 'Professor' : u.perfil);
    return Object.assign({}, u, {perfil: p});
  }).filter(function(u){
    return u.perfil === 'Coordenador' || u.perfil === 'Professor';
  });

  var temAdmin = lista.some(function(u){ return String(u.usuario || '').toLowerCase() === 'admin'; });
  if(!temAdmin){
    lista.unshift({id:1, nome:'Administrador', usuario:'admin', senha:'1234', perfil:'Coordenador'});
  }
  return lista;
}

function normalizarDb(obj){
  var base = dadosIniciais();
  var x = obj && typeof obj === 'object' ? obj : {};
  db = {
    materiais: Array.isArray(x.materiais) ? x.materiais : base.materiais,
    equip: Array.isArray(x.equip) ? x.equip : base.equip,
    emp: Array.isArray(x.emp) ? x.emp : [],
    hist: Array.isArray(x.hist) ? x.hist : []
  };

  if(db.equip && Array.isArray(db.equip)){
    db.equip = db.equip.map(function(e){
      return {
        id: e.id || Date.now(),
        nome: e.nome || 'Equipamento',
        modelo: e.modelo || '-',
        cor: e.cor || e.pat || '-',
        total: typeof e.total === 'number' ? e.total : 1,
        disp: typeof e.disp === 'number' ? e.disp : (typeof e.total === 'number' ? e.total : 1),
        emp: typeof e.emp === 'number' ? e.emp : 0
      };
    });
  }
}

var usuarios = normalizarUsuarios(JSON.parse(localStorage.getItem(AUTH_KEY) || '[]'));

var escolaAtual = localStorage.getItem('ls_escola') || '';

var db = null;

normalizarDb(JSON.parse(localStorage.getItem(K) || 'null'));

function storageKey(escolaNome){
  return 'ls_pro_' + String(escolaNome || '').trim().toLowerCase().replace(/[^a-z0-9áàâãéêíóôõúç]+/gi,'_').replace(/^_|_$/g,'');
}

function usarEscola(escolaNome){
  escolaNome = String(escolaNome || '').trim();
  if(!escolaNome) return;
  escolaAtual = escolaNome;
  escola = escolaNome;
  K = storageKey(escolaNome);
  localStorage.setItem('ls_escola', escolaNome);
}

async function carregarDadosOnline(escolaNome, criarSeNaoExistir){
  escolaNome = String(escolaNome || '').trim();
  if(!escolaNome) return false;

  var keyAnterior = K;
  usarEscola(escolaNome);

  try{
    var rows = await sbRequest('ls_app_data', 'GET', 'select=*&escola=eq.' + encodeURIComponent(escolaNome) + '&limit=1');
    var row = rows && rows.length ? rows[0] : null;

    if(row){
      usuarios = normalizarUsuarios(row.usuarios);
      normalizarDb(row.db);
      localStorage.setItem(AUTH_KEY, JSON.stringify(usuarios));
      localStorage.setItem(K, JSON.stringify(db));
      onlineReady = true;
      return true;
    }

    // Primeira utilização desta escola: aproveita o cache local dessa escola,
    // ou cria o ambiente inicial do protótipo.
    var cache = JSON.parse(localStorage.getItem(K) || 'null');
    normalizarDb(cache || dadosIniciais());
    usuarios = normalizarUsuarios(JSON.parse(localStorage.getItem(AUTH_KEY) || '[]'));

    if(criarSeNaoExistir !== false){
      await sbRequest('ls_app_data', 'POST', '', {
        escola: escolaNome,
        usuarios: usuarios,
        db: db
      }, {'Prefer':'return=minimal'});
    }

    localStorage.setItem(AUTH_KEY, JSON.stringify(usuarios));
    localStorage.setItem(K, JSON.stringify(db));
    onlineReady = true;
    return true;
  }catch(err){
    onlineReady = false;
    // Mantém o protótipo funcionando com o cache local se o banco estiver indisponível.
    var cacheLocal = JSON.parse(localStorage.getItem(K) || 'null');
    if(cacheLocal) normalizarDb(cacheLocal);
    if(keyAnterior && keyAnterior !== K){
      // nada: o cache da escola já foi tentado acima
    }
    console.error('Erro ao carregar Supabase:', err);
    notify('Não foi possível sincronizar com o banco online. O modo local foi mantido.', 'warning');
    return false;
  }
}

async function salvarDadosOnline(){
  if(!onlineReady || !escola) return false;
  if(onlineSaving) return false;
  onlineSaving = true;
  try{
    await sbRequest('ls_app_data', 'PATCH', 'escola=eq.' + encodeURIComponent(escola), {
      usuarios: usuarios,
      db: db,
      updated_at: new Date().toISOString()
    }, {'Prefer':'return=minimal'});
    return true;
  }catch(err){
    console.error('Erro ao salvar no Supabase:', err);
    notify('Alteração salva neste dispositivo, mas não foi sincronizada com o servidor.', 'warning');
    return false;
  }finally{
    onlineSaving = false;
  }
}

function save(){
  localStorage.setItem(K, JSON.stringify(db));
  localStorage.setItem(AUTH_KEY, JSON.stringify(usuarios));
  if(onlineReady) salvarDadosOnline();
}

async function inicializarApp(){
  if(usuarioAtual && usuarioAtual.escola){
    var ok = await carregarDadosOnline(usuarioAtual.escola, true);
    if(ok){
      var atual = usuarios.find(function(u){ return String(u.usuario).toLowerCase() === String(usuarioAtual.usuario).toLowerCase(); });

    normalizarDb(JSON.parse(localStorage.getItem(K) || 'null'));

}

function esc(x){
    var v = (x !== null && x !== undefined) ? String(x) : '';
    return v.replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];
    });
}

// SISTEMA DE NOTIFICAÇÕES (TOAST)
function notify(texto, tipo) {
  tipo = tipo || 'success';
  var container = document.getElementById('toast-container');
  if (!container) return;

  var toast = document.createElement('div');
  toast.className = 'toast-enter pointer-events-auto flex items-center gap-3 p-4 rounded-2xl shadow-lg border text-xs font-semibold ' +
    (tipo === 'error' ? 'bg-red-600 text-white border-red-700' :
     tipo === 'warning' ? 'bg-amber-500 text-white border-amber-600' :
     'bg-gray-900 text-white dark:bg-white dark:text-gray-900 border-gray-800');

  var icone = tipo === 'error' ? 'fa-circle-xmark' :
              tipo === 'warning' ? 'fa-triangle-exclamation' :
              'fa-circle-check';

  toast.innerHTML = '<i class="fas ' + icone + ' text-base"></i><span class="flex-1">' + esc(texto) + '</span>';
  container.appendChild(toast);

  setTimeout(function() {
    toast.classList.remove('toast-enter');
    toast.classList.add('toast-exit');
    setTimeout(function() { toast.remove(); }, 300);
  }, 3000);
}

function msg(t, tipo){
  notify(t, tipo || 'warning');
}

// MODAL DE CONFIRMAÇÃO PERSONALIZADO
function pedirConfirmacao(mensagem, aoConfirmar) {
  var modal = document.getElementById('confirm-modal');
  var msgEl = document.getElementById('confirm-msg');
  var btnOk = document.getElementById('confirm-btn-ok');
  var btnCancel = document.getElementById('confirm-btn-cancel');

  msgEl.textContent = mensagem;
  modal.classList.remove('hidden');

  function fechar() {
    modal.classList.add('hidden');
    btnOk.onclick = null;
    btnCancel.onclick = null;
  }

  btnCancel.onclick = fechar;
  btnOk.onclick = function() {
    fechar();
    aoConfirmar();
  };
}

// FUNÇÃO PARA ALTERNAR A VISIBILIDADE DOS CAMPOS DE SENHA E TOKEN
function alternarVisibilidadeCampo(idInput, idIcone) {
  var campo = document.getElementById(idInput);
  var icone = document.getElementById(idIcone);
  if (!campo || !icone) return;

  if (campo.type === 'password') {
    campo.type = 'text';
    icone.classList.remove('fa-eye');
    icone.classList.add('fa-eye-slash');
  } else {
    campo.type = 'password';
    icone.classList.remove('fa-eye-slash');
    icone.classList.add('fa-eye');
  }
}

async function solicitarTokenEmail(){
  var emailEl = document.getElementById('cemail');
  var escolaEl = document.getElementById('cescola');
  var email = emailEl ? emailEl.value.trim() : '';
  var escolaSolicitante = escolaEl ? escolaEl.value.trim() : '';

  if(!email || !email.includes('@')){
    msg('Por favor, digite um e-mail válido para solicitar o token.', 'error');
    return;
  }
  if(!escolaSolicitante){
    msg('Informe a escola antes de solicitar o token.', 'error');
    return;
  }

  try{
    var pendentes = await sbRequest('solicitacoes', 'GET',
      'select=id&email=eq.' + encodeURIComponent(email) +
      '&escola=eq.' + encodeURIComponent(escolaSolicitante) +
      '&status=eq.pendente&limit=1');

    if(pendentes && pendentes.length){
      msg('Já existe uma solicitação pendente para este e-mail.', 'warning');
      return;
    }

    await sbRequest('solicitacoes', 'POST', '', {
      escola: escolaSolicitante,
      email: email,
      data: new Date().toLocaleString('pt-BR'),
      status: 'pendente'
    }, {'Prefer':'return=minimal'});

    notify('Solicitação enviada! Aguarde a aprovação.', 'success');
  }catch(err){
    console.error(err);
    msg('Não foi possível enviar a solicitação online. Verifique as permissões da tabela solicitacoes no Supabase.', 'error');
  }
}

async function criarCadastro(){
 var escolaEl = document.getElementById('cescola'), userEl = document.getElementById('cuser'),
 senhaEl = document.getElementById('csenha'), confirmEl = document.getElementById('cconfirm'),
 perfilEl = document.getElementById('cperfil'), tokenEl = document.getElementById('ctoken'), emailEl = document.getElementById('cemail');
 
 var escolaNova = (escolaEl && escolaEl.value ? escolaEl.value : '').trim();
 var emailNovo = (emailEl && emailEl.value ? emailEl.value : '').trim();
 var usuario = (userEl && userEl.value ? userEl.value : '').trim();
 var senha = senhaEl ? senhaEl.value : '';
 var confirmar = confirmEl ? confirmEl.value : '';
 var perfilNovo = (perfilEl && perfilEl.value) ? perfilEl.value : 'Professor';
 var tokenDigitado = tokenEl ? tokenEl.value.trim() : '';
 
 if(!escolaNova || !emailNovo || !usuario || !senha || !confirmar){msg('Preencha todos os campos.', 'error');return false;}
 if(senha !== confirmar){msg('As senhas não são iguais.', 'error');return false;}
 if(usuario.length < 3){msg('O usuário deve ter pelo menos 3 caracteres.', 'error');return false;}

 // Carrega a escola antes de validar/cadastrar, evitando misturar usuários de escolas diferentes.
 var escolaCarregada = await carregarDadosOnline(escolaNova, true);
 if(!escolaCarregada){
   msg('Não foi possível conectar ao banco para concluir o cadastro.', 'error');
   return false;
 }

 if(perfilNovo === 'Coordenador'){
   if(!tokenDigitado){
     msg('Informe o Token de Segurança do Coordenador.', 'error');
     return false;
   }

   try{
     var tokens = await sbRequest('token', 'GET',
       'select=id,token,status,escola,email&token=eq.' + encodeURIComponent(tokenDigitado) + '&limit=1');
     var tokenValido = tokens && tokens.length ? tokens[0] : null;

     if(!tokenValido){
       msg('Token inválido. Solicite um token de acesso ao administrador.', 'error');
       return false;
     }
     if(String(tokenValido.status || '').toLowerCase() === 'usado'){
       msg('Esse token já foi utilizado. Solicite um novo token.', 'error');
       return false;
     }
     if(tokenValido.email && String(tokenValido.email).toLowerCase() !== emailNovo.toLowerCase()){
       msg('Esse token foi liberado para outro e-mail.', 'error');
       return false;
     }
     if(tokenValido.escola && String(tokenValido.escola).toLowerCase() !== escolaNova.toLowerCase()){
       msg('Esse token foi liberado para outra escola.', 'error');
       return false;
     }

     await sbRequest('token', 'PATCH', 'id=eq.' + encodeURIComponent(tokenValido.id), {
       status: 'usado'
     }, {'Prefer':'return=minimal'});
   }catch(err){
     console.error(err);
     msg('Token inválido. Verifique o código informado e tente novamente.', 'error');
     return false;
   }
 }

 var usuarioExiste = usuarios.some(function(u){
    var uNome = (u && u.usuario) ? String(u.usuario) : '';
    return uNome.toLowerCase() === usuario.toLowerCase();
 });
 if(usuarioExiste){msg('Esse usuário já existe. Escolha outro.', 'error');return false;}

 var novo = {id:Date.now(), nome:usuario, usuario:usuario, email:emailNovo, senha:senha, perfil:perfilNovo, escola:escolaNova};
 usuarios.push(novo);
 usarEscola(escolaNova);
 localStorage.setItem(AUTH_KEY, JSON.stringify(usuarios));
 localStorage.setItem(K, JSON.stringify(db));

 var salvou = await salvarDadosOnline();
 if(!salvou){
   usuarios = usuarios.filter(function(u){ return u.id !== novo.id; });
   localStorage.setItem(AUTH_KEY, JSON.stringify(usuarios));
   msg('O cadastro não foi sincronizado com o servidor.', 'error');
   return false;
 }

 notify('Cadastro concluído com sucesso!', 'success');
 abrirLogin(perfilNovo);
 return false;
}

async function login(tipo){
 var escolaEl = document.getElementById('lescola'), userEl = document.getElementById('luser'), senhaEl = document.getElementById('lsenha'), lembrarEl = document.getElementById('lembrar');
 var e = (escolaEl && escolaEl.value ? escolaEl.value : '').trim();
 var u = (userEl && userEl.value ? userEl.value : '').trim();
 var s = senhaEl ? senhaEl.value : '';
 var lembrar = !!(lembrarEl && lembrarEl.checked);

 if(!e || !u || !s){msg('Preencha escola, usuário e senha.', 'error');return false;}

 var carregou = await carregarDadosOnline(e, true);
 if(!carregou){
   msg('Não foi possível consultar o banco online. Tente novamente.', 'error');
   return false;
 }

 var x = usuarios.find(function(a){
    var uName = (a && a.usuario) ? String(a.usuario).trim().toLowerCase() : '';
    var uPass = (a && a.senha !== undefined && a.senha !== null) ? String(a.senha) : '';
    return uName === u.toLowerCase() && uPass === s;
 });

 if(!x){msg('Usuário ou senha incorretos.', 'error');return false;}
 if(tipo && x.perfil !== tipo){msg('Esse usuário não pertence ao perfil escolhido.', 'error');return false;}
 if(x.escola && String(x.escola).toLowerCase() !== e.toLowerCase()){msg('Esse usuário não está cadastrado nesta escola.', 'error');return false;}

 escola = e;
 usarEscola(e);
 perfil = x.perfil;
 usuarioAtual = x;
 alertasLidos = false;
 sessionStorage.setItem('ls_user', JSON.stringify(x));
 if(lembrar) localStorage.setItem('ls_escola', e); else localStorage.removeItem('ls_escola');
 notify('Login realizado com sucesso!', 'success');
 dashboard();
 return false;
}

  var qtd = Number(mq.value);

  db.materiais.push({id:Date.now(), nome:mn.value.trim(), cat:mc.value, qtd:qtd, min:min, un:mu.value});

function confirmarSaida(id){
  if(perfil !== 'Coordenador') return;
  var qInput = document.getElementById('qntSaida');
  var q = Number(qInput ? qInput.value : 0);
  var p = db.materiais.find(function(x){ return x.id === id; });
  if(!q || q <= 0){
    msg('Por favor, informe uma quantidade válida.', 'error');
    return;
  }
  if(p){
    if(q > p.qtd){
      msg('Estoque insuficiente!', 'error');
      return;
    }
    p.qtd -= q;
    hist('Saída', p.nome, '-' + q, usuarioAtual ? usuarioAtual.nome : 'Usuário');
    save();

    if(p.qtd <= p.min){
      alertasLidos = false;
      notify('Saída registrada! Item atingiu estoque mínimo.', 'warning');
    } else {
      notify('Saída registrada com sucesso!', 'success');
    }

    materiais();
  }
}

function addEmp(){
  var le = document.getElementById('le'), lq = document.getElementById('lq'), lp = document.getElementById('lp'), ld = document.getElementById('ld');
  var p = db.materiais.find(function(x){ return x.id === Number(le.value); });
  var q = Number(lq.value);
  var pessoa = lp.value.trim();
  var destino = ld.value.trim();

  if(!p) return msg('Selecione um item.', 'error');
  if(!q || q <= 0) return msg('Informe uma quantidade válida.', 'error');
  if(q > Number(p.qtd || 0))
    return msg('Quantidade indisponível! Disponíveis: ' + Number(p.qtd || 0), 'error');
  if(!pessoa || !destino) return msg('Preencha quem retirou e a sala/setor.', 'error');

  var data = new Date().toLocaleString('pt-BR');

  p.qtd -= q;

  db.emp.unshift({
    id: Date.now(),
    materialId: p.id,
    qtd: q,
    pessoa: pessoa,
    destino: destino,
    data: data,
    ativo: true
  });

  hist('Empréstimo', p.nome, q + ' un.', pessoa + ' · ' + destino);
  save();

  if(p.qtd <= p.min){
    alertasLidos = false;
    notify('Retirada registrada! Item atingiu estoque mínimo.', 'warning');
  } else {
    notify('Empréstimo registrado com sucesso!', 'success');
  }

  emprestimos();
}

function devolver(id){
  var l = db.emp.find(function(x){ return x.id === id; });
  if(!l) return;

  var p = db.materiais.find(function(x){ return Number(x.id) === Number(l.materialId); });

  if(p){
    p.qtd += Number(l.qtd || 0);
  }

  l.ativo = false;

  hist('Devolução', p ? p.nome : 'Item', (l.qtd || 1) + ' un.', l.pessoa);
  save();
  notify('Devolução realizada com sucesso!', 'success');
  emprestimos();
}

function alertas(){
  if(perfil !== 'Coordenador') return msg('Acesso permitido somente ao Coordenador.', 'error');
  
  alertasLidos = true;

  var a = db.materiais.filter(function(p){ return p.qtd <= p.min; });
  
  var lista = a.length ? a.map(function(p){
    return '<div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-xl mb-3 text-red-800 text-xs sm:text-sm">' +
      '<b>' + esc(p.nome) + '</b> está com ' + p.qtd + ' ' + p.un + '. Mínimo: ' + p.min + ' ' + p.un + '.' +
    '</div>';
  }).join('') : '<div class="text-center p-8 text-green-600 font-semibold text-sm">✓ Nenhum item abaixo do estoque mínimo.</div>';

  shell(
    head('Alertas','Estoque crítico') +
    '<div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border">' + lista + '</div>'
  );
}

function imprimirRelatorio(){
  var ativos = db.emp.filter(function(x){ return x.ativo; });
  var printArea = document.getElementById('print-area');
  var dataHoje = new Date().toLocaleString('pt-BR');
  
  var tabelaEmp = ativos.length ? ativos.map(function(l){
    var p = db.materiais.find(function(x){ return Number(x.id) === Number(l.materialId); });
    var e = db.equip.find(function(x){ return Number(x.id) === Number(l.equipId); });
    var nome = (p && p.nome) ? p.nome : ((e && e.nome) ? e.nome : 'Item');

    return '<tr style="border-bottom: 1px solid #e2e8f0;">' +
      '<td style="padding: 6px 8px; border: 1px solid #cbd5e1; font-weight: bold;">' + esc(nome) + '</td>' +
      '<td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">' + (l.qtd || 1) + '</td>' +
      '<td style="padding: 6px 8px; border: 1px solid #cbd5e1; font-weight: bold;">' + esc(l.pessoa) + '</td>' +
      '<td style="padding: 6px 8px; border: 1px solid #cbd5e1;">' + esc(l.destino) + '</td>' +
      '<td style="padding: 6px 8px; border: 1px solid #cbd5e1;">' + l.data + '</td>' +
    '</tr>';
  }).join('') : '<tr><td colspan="5" style="padding: 10px; text-align: center; color: #666; border: 1px solid #cbd5e1;">Nenhum material em posse de terceiros no momento.</td></tr>';

  var tabelaAlerta = db.materiais.filter(function(p){ return p.qtd <= p.min; }).map(function(p){
    return '<tr style="border-bottom: 1px solid #e2e8f0;">' +
      '<td style="padding: 6px 8px; border: 1px solid #cbd5e1;">' + esc(p.nome) + '</td>' +
      '<td style="padding: 6px 8px; border: 1px solid #cbd5e1;">' + esc(p.cat) + '</td>' +
      '<td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center; color: #dc2626; font-weight: bold;">' + p.qtd + ' ' + p.un + '</td>' +
      '<td style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">' + p.min + ' ' + p.un + '</td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="4" style="padding: 10px; text-align: center; color: #666; border: 1px solid #cbd5e1;">Todos os itens estão com saldo dentro do esperado.</td></tr>';

  var secaoCoord = perfil === 'Coordenador' ? 
    '<h2 style="font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #0F2C59;">Resumo do Estoque em Alerta</h2>' +
    '<table style="width: 100%; border-collapse: collapse; font-size: 12px;">' +
      '<thead>' +
        '<tr style="background-color: #f1f5f9; text-align: left; border-bottom: 1px solid #cbd5e1;">' +
          '<th style="padding: 6px 8px; border: 1px solid #cbd5e1;">Material</th>' +
          '<th style="padding: 6px 8px; border: 1px solid #cbd5e1;">Categoria</th>' +
          '<th style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">Saldo Atual</th>' +
          '<th style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">Mínimo</th>' +
        '</tr>' +
      '</thead>' +
      '<tbody>' + tabelaAlerta + '</tbody>' +
    '</table>' : '';

  if (printArea) {
    printArea.innerHTML = 
      '<div style="font-family: sans-serif; color: #111;">' +
        '<div style="border-bottom: 2px solid #0F2C59; padding-bottom: 12px; margin-bottom: 20px;">' +
          '<h1 style="font-size: 20px; font-weight: bold; color: #0F2C59; margin: 0;">Relatório do Almoxarifado - ' + esc(escola) + '</h1>' +
          '<p style="font-size: 11px; color: #666; margin: 4px 0 0 0;">Emitido em: ' + dataHoje + ' | Operador: ' + esc(perfil) + '</p>' +
        '</div>' +
        '<h2 style="font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #2E7D32;">Materiais Atualmente Emprestados</h2>' +
        '<table style="width: 100%; border-collapse: collapse; margin-bottom: 25px; font-size: 12px;">' +
          '<thead>' +
            '<tr style="background-color: #f1f5f9; text-align: left; border-bottom: 1px solid #cbd5e1;">' +
              '<th style="padding: 6px 8px; border: 1px solid #cbd5e1;">Item / Material</th>' +
              '<th style="padding: 6px 8px; border: 1px solid #cbd5e1; text-align: center;">Qtd.</th>' +
              '<th style="padding: 6px 8px; border: 1px solid #cbd5e1;">Retirado por</th>' +
              '<th style="padding: 6px 8px; border: 1px solid #cbd5e1;">Destino / Sala</th>' +
              '<th style="padding: 6px 8px; border: 1px solid #cbd5e1;">Data / Hora</th>' +
            '</tr>' +
          '</thead>' +
          '<tbody>' + tabelaEmp + '</tbody>' +
        '</table>' +
        secaoCoord +
      '</div>';
  }

  window.print();
}

function relatorios(){
  var total = db.materiais.reduce(function(a,p){ return a + p.qtd; }, 0);
  var e = db.emp.filter(function(x){ return x.ativo; }).reduce(function(acc, x){ return acc + (x.qtd || 1); }, 0);
  var ativos = db.emp.filter(function(x){ return x.ativo; });

  var tabelaDesktop = ativos.map(function(l){
    var p = db.materiais.find(function(x){ return Number(x.id) === Number(l.materialId); });
    var eg = db.equip.find(function(x){ return Number(x.id) === Number(l.equipId); });
    var nome = (p && p.nome) ? p.nome : ((eg && eg.nome) ? eg.nome : 'Item');

    return '<tr>' +
      '<td class="p-3 font-semibold">' + esc(nome) + '</td>' +
      '<td class="p-3 font-bold text-brandLightBlue">' + (l.qtd || 1) + '</td>' +
      '<td class="p-3 font-semibold text-brandGreen">' + esc(l.pessoa) + '</td>' +
      '<td class="p-3 text-gray-500">' + esc(l.destino) + '</td>' +
      '<td class="p-3 text-xs text-gray-400">' + l.data + '</td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="5" class="p-6 text-center text-gray-400">Nenhum material emprestado no momento.</td></tr>';

  var cardsMobile = ativos.map(function(l){
    var p = db.materiais.find(function(x){ return Number(x.id) === Number(l.materialId); });
    var eg = db.equip.find(function(x){ return Number(x.id) === Number(l.equipId); });
    var nome = (p && p.nome) ? p.nome : ((eg && eg.nome) ? eg.nome : 'Item');

    return '<div class="p-3.5 space-y-1 text-xs">' +
      '<div class="flex justify-between items-start">' +
        '<span class="font-bold text-sm text-gray-900 dark:text-white">' + esc(nome) + '</span>' +
        '<span class="bg-blue-50 text-brandLightBlue px-2 py-0.5 rounded font-bold">' + (l.qtd || 1) + ' un.</span>' +
      '</div>' +
      '<div class="text-brandGreen font-medium">Quem retirou: <strong>' + esc(l.pessoa) + '</strong></div>' +
      '<div class="text-gray-400 flex justify-between">' +
        '<span>Destino: ' + esc(l.destino) + '</span>' +
        '<span class="text-[10px]">' + l.data + '</span>' +
      '</div>' +
    '</div>';
  }).join('') || '<div class="p-6 text-center text-gray-400 text-xs">Nenhum material emprestado no momento.</div>';

  shell(
    head('Relatorios','Resumo do almoxarifado') +
    '<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-5">' +
      stat('boxes','Tipos de materiais',db.materiais.length,'brandDarkBlue') +
      stat('cubes','Itens físicos',total,'brandGreen') +
      stat('hand-holding','Emprestados',e,'red-500') +
    '</div>' +
    '<div class="bg-white dark:bg-gray-800 rounded-2xl p-4 sm:p-6 border shadow-sm mb-5">' +
      '<div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-4">' +
        '<div>' +
          '<h2 class="font-bold text-base sm:text-lg">Materiais Emprestados</h2>' +
          '<p class="text-xs text-gray-400">Esta lista será enviada para impressão</p>' +
        '</div>' +
        '<button onclick="imprimirRelatorio()" class="bg-brandDarkBlue text-white p-3 px-5 rounded-xl font-bold text-xs sm:text-sm shadow hover:opacity-90 flex items-center justify-center gap-2">' +
          '<i class="fas fa-print"></i> <span>Imprimir Relatório</span>' +
        '</button>' +
      '</div>' +
      '<div class="rounded-xl border overflow-hidden">' +
        '<div class="hidden sm:block overflow-x-auto">' +
          '<table class="w-full text-left">' +
            '<thead>' +
              '<tr class="bg-gray-100 dark:bg-gray-700 text-gray-500 text-xs uppercase">' +
                '<th class="p-3">Material / Item</th>' +
                '<th class="p-3">Qtd.</th>' +
                '<th class="p-3">Quem Retirou</th>' +
                '<th class="p-3">Destino</th>' +
                '<th class="p-3">Data</th>' +
              '</tr>' +
            '</thead>' +
            '<tbody class="divide-y dark:divide-gray-700 text-sm">' + tabelaDesktop + '</tbody>' +
          '</table>' +
        '</div>' +
        '<div class="block sm:hidden divide-y dark:divide-gray-700">' + cardsMobile + '</div>' +
      '</div>' +
    '</div>'
  );
}

function bindForms(){
 var lf = document.getElementById('loginForm');
 if(lf){
   lf.onsubmit = function(ev){ ev.preventDefault(); login(this.getAttribute('data-tipo')); return false; };
 }
 var cf = document.getElementById('cadastroForm');
 if(cf){
   cf.onsubmit = function(ev){ ev.preventDefault(); criarCadastro(); return false; };
 }
}

var _abrirLogin = abrirLogin;
abrirLogin = function(tipo){
 _abrirLogin(tipo);
 var f = document.getElementById('loginForm');
 if(f) f.setAttribute('data-tipo', tipo);
 bindForms();
};

var _cadastro = cadastro;
cadastro = function(){
 _cadastro();
 bindForms();
};

// Inicialização: tenta carregar a escola/usuário do Supabase antes de abrir o painel.
inicializarApp();

</script>
</body>
</html>
