/* =========================================================

var SESSION_KEY = 'ls_secure_session';
var SESSION_TIMEOUT = 30 * 60 * 1000; // 30 minutos
var SESSION_WARNING = 5 * 60 * 1000;  // aviso nos últimos 5 minutos
var sessionTimer = null;
var sessionWarningShown = false;

function salvarUsuariosLocalSeguro(){
  try{
    var seguro = (Array.isArray(usuarios) ? usuarios : []).map(function(u){

    });

  }catch(e){ console.warn('Não foi possível atualizar o cache seguro de usuários.', e); }
}

function salvarSessaoSegura(usuario){
  if(!usuario) return;
  var sessao = {
    id: usuario.id,
    usuario: usuario.usuario,
    perfil: usuario.perfil,
    email: usuario.email || '',
    escola: usuario.escola || escolaAtual,
    ultimoAcesso: Date.now()
  };
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessao));
  sessionStorage.setItem('ls_user', JSON.stringify(sessao));
  iniciarMonitorSessao();
}

function lerSessaoSegura(){
  try{
    var raw = sessionStorage.getItem(SESSION_KEY) || sessionStorage.getItem('ls_user');
    if(!raw) return null;
    var s = JSON.parse(raw);
    if(!s || !s.ultimoAcesso || (Date.now() - Number(s.ultimoAcesso)) > SESSION_TIMEOUT){
      sessionStorage.removeItem(SESSION_KEY);
      sessionStorage.removeItem('ls_user');
      return null;
    }
    return s;
  }catch(e){
    sessionStorage.removeItem(SESSION_KEY);
    sessionStorage.removeItem('ls_user');
    return null;
  }
}

function tocarSessao(){
  var s = lerSessaoSegura();
  if(!s) return false;
  s.ultimoAcesso = Date.now();
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(s));
  sessionStorage.setItem('ls_user', JSON.stringify(s));
  sessionWarningShown = false;
  return true;
}

function encerrarSessaoPorInatividade(){
  if(sessionTimer) clearInterval(sessionTimer);
  sessionTimer = null;
  sessionStorage.removeItem(SESSION_KEY);
  sessionStorage.removeItem('ls_user');
  usuarioAtual = null;
  perfil = 'Coordenador';
  notify('Sua sessão expirou por segurança. Faça login novamente.', 'warning');
  telaInicial();
}

function iniciarMonitorSessao(){
  if(sessionTimer) clearInterval(sessionTimer);
  sessionWarningShown = false;
  sessionTimer = setInterval(function(){
    var s = lerSessaoSegura();
    if(!s){ clearInterval(sessionTimer); sessionTimer=null; return; }
    var restante = SESSION_TIMEOUT - (Date.now() - Number(s.ultimoAcesso));
    if(restante <= 0){ encerrarSessaoPorInatividade(); return; }
    if(restante <= SESSION_WARNING && !sessionWarningShown){
      sessionWarningShown = true;
      notify('Sua sessão será encerrada em alguns minutos se não houver atividade.', 'warning');
    }
  }, 15000);
}

async function gerarHashSenha(senha, saltB64){
  var salt;
  if(saltB64){
    var bin = atob(saltB64), arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    salt = arr;
  }else{
    salt = crypto.getRandomValues(new Uint8Array(16));
  }
  var enc = new TextEncoder();
  var keyMaterial = await crypto.subtle.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:salt, iterations:120000, hash:'SHA-256'}, keyMaterial, 256);
  var bytes = new Uint8Array(bits), bin2='';
  for(var j=0;j<bytes.length;j++) bin2 += String.fromCharCode(bytes[j]);
  var saltBin='';
  for(var k=0;k<salt.length;k++) saltBin += String.fromCharCode(salt[k]);
  return {hash:btoa(bin2), salt:btoa(saltBin)};
}

async function senhaValida(usuario, senha){
  if(usuario && usuario.senhaHash && usuario.senhaSalt){
    var h = await gerarHashSenha(senha, usuario.senhaSalt);
    return h.hash === usuario.senhaHash;
  }
  // Compatibilidade/migração: contas antigas ainda podem possuir senha em texto puro.
  return usuario && usuario.senha !== undefined && usuario.senha !== null && String(usuario.senha) === String(senha);
}

async function migrarSenhaSeNecessario(usuario, senha){
  if(!usuario || usuario.senhaHash) return false;
  var h = await gerarHashSenha(senha);
  usuario.senhaHash = h.hash;
  usuario.senhaSalt = h.salt;
  delete usuario.senha;
  return true;
}

function sbHeaders(extra){
  var h = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  };
  if(extra) Object.keys(extra).forEach(function(k){ h[k] = extra[k]; });
  return h;
}

function sbUrl(table, query){
  return SUPABASE_REST + '/' + table + (query ? '?' + query : '');
}

async function sbRequest(table, method, query, body, extraHeaders){
  var resp = await fetch(sbUrl(table, query), {
    method: method || 'GET',
    headers: sbHeaders(extraHeaders),
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  var text = await resp.text();
  var data = null;
  if(text){ try { data = JSON.parse(text); } catch(e) { data = text; } }
  if(!resp.ok){
    var detalhe = data && data.message ? data.message : (data && data.error ? data.error : text);
    throw new Error('Supabase ' + resp.status + ': ' + (detalhe || 'erro na API'));
  }
  return data;
}

function esc(x){
    var v = (x !== null && x !== undefined) ? String(x) : '';
    return v.replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];
    });
}

// SISTEMA DE NOTIFICAÇÕES (TOAST)
function notify(texto, tipo) {
  tipo = tipo || 'success';
  var container = document.getElementById('toast-container');
  if (!container) return;

  var toast = document.createElement('div');
  toast.className = 'toast-enter pointer-events-auto flex items-center gap-3 p-4 rounded-2xl shadow-lg border text-xs font-semibold ' +
    (tipo === 'error' ? 'bg-red-600 text-white border-red-700' :
     tipo === 'warning' ? 'bg-amber-500 text-white border-amber-600' :
     'bg-gray-900 text-white dark:bg-white dark:text-gray-900 border-gray-800');

  var icone = tipo === 'error' ? 'fa-circle-xmark' :
              tipo === 'warning' ? 'fa-triangle-exclamation' :
              'fa-circle-check';

  toast.innerHTML = '<i class="fas ' + icone + ' text-base"></i><spa
